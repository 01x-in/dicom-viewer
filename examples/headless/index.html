<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headless example</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
      #app { display: flex; gap: 12px; padding: 12px; }
      #series { width: 260px; display: flex; flex-direction: column; gap: 6px; }
      #series button { text-align: left; padding: 6px 8px; }
      #series button[aria-pressed='true'] { outline: 2px solid #4af; }
      #viewport { width: 512px; height: 512px; background: #000; }
      #files { margin-bottom: 8px; }
      #tools { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
      #tools button[aria-pressed='true'] { outline: 2px solid #4af; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <input id="files" type="file" multiple accept=".dcm,application/dicom" />
        <div id="series"></div>
        <div id="tools"></div>
        <p id="position"></p>
      </aside>
      <div id="viewport"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
