<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedded card example</title>
    <style>
      /* The host's own page: the card around the viewer is the host's, not the package's. */
      body { margin: 0; background: #f4f7fa; font: 14px/1.4 system-ui, sans-serif; color: #1f2937; }
      .card { max-width: 640px; margin: 24px auto; padding: 16px; }
      header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
      h1 { font-size: 17px; margin: 0; }
      .meta { color: #6b7280; font-size: 13px; }
      select { font: inherit; padding: 6px 10px; border: 1px solid #d5dbe3; border-radius: 6px; background: #fff; }
      .series { display: flex; gap: 6px; margin-bottom: 8px; }
      .series button { font: inherit; padding: 2px 10px; border: 1px solid #d5dbe3; border-radius: 999px; background: #fff; cursor: pointer; }
      .series button[aria-pressed='true'] { background: #1f2937; color: #fff; border-color: #1f2937; }
      /* Only these lines change how the viewer looks. */
      dv-viewer {
        display: block; height: 520px; border-radius: 8px; overflow: hidden;
        --dv-color-accent: #2dd4a7;
        --dv-color-accent-text: #053b2e;
        --dv-radius: 6px;
        --dv-font-family: 'IBM Plex Sans', system-ui, sans-serif;
        --dv-font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      }
      .source { color: #6b7280; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <div>
          <h1 id="title">Loading</h1>
          <div class="meta" id="meta"></div>
        </div>
        <select id="studies" aria-label="Study"></select>
      </header>
      <div class="series" id="series"></div>
      <dv-viewer id="viewer" hide-series-panel hide-measurements-panel hide-segmentations-panel></dv-viewer>
      <div class="source">Source: DICOMweb (WADO-RS). Synthetic phantom data. Not for diagnosis.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
