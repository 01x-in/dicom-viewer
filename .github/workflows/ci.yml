name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # What a consumer's tooling sees: publint and are-the-types-wrong on the packed tarballs.
      - run: pnpm package-check
      # Brotli budgets on the emitted files (.size-limit.json): a bigger bundle is a decision, not an accident.
      - run: pnpm size
      # The API reference builds with warnings as errors: a broken link in a comment fails here.
      - run: pnpm docs:api

  matrix:
    name: Installability matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate && pnpm build
      # Packs the tarballs, installs each example from them, builds it, and runs the browser smoke test.
      # The SEG of the performance budget (3 s on a developer machine) is generated here with uv. A
      # shared runner is several times slower than that machine, so it gets a looser limit.
      - run: pnpm matrix
        env:
          DV_SEG_BUDGET_MS: 9000

  phantom:
    name: Phantom tests and fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test the generator
        working-directory: tools/phantom
        run: uv run --frozen pytest -q
      - name: Committed fixtures match their checksums
        working-directory: fixtures/phantom
        run: |
          sha256sum -c --quiet SHA256SUMS
          # sha256sum -c ignores files absent from the manifest, so reject those explicitly.
          diff <(awk '{print $2}' SHA256SUMS | sort) <(find . -type f -name '*.dcm' | sed 's|^\./||' | sort)
      - name: Regenerated fixtures match the committed ones
        working-directory: tools/phantom
        run: |
          uv run --frozen python phantom.py "$RUNNER_TEMP/phantom"
          # Compares the whole tree, so stale or extra files fail too (README.md is hand-written).
          diff -r -x README.md ../../fixtures/phantom "$RUNNER_TEMP/phantom"
