name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  phantom:
    name: Phantom tests and fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test the generator
        working-directory: tools/phantom
        run: uv run --frozen pytest -q
      - name: Committed fixtures match their checksums
        working-directory: fixtures/phantom
        run: sha256sum -c --quiet SHA256SUMS
      - name: Regenerated fixtures match the committed ones
        working-directory: tools/phantom
        run: |
          uv run --frozen python phantom.py "$RUNNER_TEMP/phantom"
          diff ../../fixtures/phantom/SHA256SUMS "$RUNNER_TEMP/phantom/SHA256SUMS"
