name: Release

# A release is its own action, apart from the development flow. Pull requests are how code gets into main; they do
# not start a release, and a release does not need a pull request. Nothing here runs when a pull request is merged
# or when someone pushes to main. Start it by hand (Actions > Release > Run workflow, on main). The run:
#
# 1. runs the gates (`pnpm check`, `package-check`, `size`, `docs:api`),
# 2. applies the changesets that are waiting in `.changeset/` (versions and changelogs) and commits that,
# 3. publishes the packages whose version is not yet on npm, with provenance, and
# 4. pushes the release commit and the tags to main, and creates the GitHub Release for the version.
#
# Nothing is pushed unless the publish worked, so a failed run leaves main as it was. With `dry_run`, the run stops
# after step 2 and prints what it would release.
#
# There is no npm token here. npm trusted publishing lets this workflow prove who it is to npm (an OIDC identity
# from GitHub, which is what `id-token: write` is for), and each package lists this repository and this file as
# its trusted publisher. It works only for a package that already exists on npm, so the first version of each
# package was published by hand (docs/guides/releasing.md).
#
# Nothing here runs until the repository variable RELEASE_ENABLED is "true" (Settings > Secrets and variables >
# Actions > Variables). A publish cannot be taken back. See docs/guides/releasing.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the gates and show the versions and changelogs it would write. Publish and push nothing.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Two releases at once would race to version and tag the same packages, and a started publish is never cancelled.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the release commit and the tags, pushed to main
      id-token: write # npm trusted publishing and provenance: the build's identity, signed by GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer. Fail here, with the reason, not at the publish.
      - name: Check that npm supports trusted publishing
        run: |
          node -e "
            const [major = 0, minor = 0, patch = 0] = process.argv[1].split('.').map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error('npm ' + process.argv[1] + ' is too old: trusted publishing needs 11.5.1 or newer.'); process.exit(1); }
          " "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package-check
      - run: pnpm size
      - run: pnpm docs:api
      # Commits and annotated tags need an author. The runner has none.
      - name: Set the Git identity for the release commit and the tags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply the changesets
        id: apply
        run: |
          pnpm version-packages
          pnpm install --lockfile-only
          git add -A
          if git diff --cached --quiet; then
            echo 'No changeset is waiting: nothing to version. Publishing what is already versioned on main.'
          else
            git commit -m 'Release'
            echo 'released=true' >> "$GITHUB_OUTPUT"
          fi
          git --no-pager show --stat --format='%h %s' HEAD
      - name: Stop here for a dry run
        if: inputs.dry_run
        run: |
          if [ '${{ steps.apply.outputs.released }}' = 'true' ]; then
            echo 'The versions and changelogs this release would write:'
            git --no-pager show --format= HEAD -- 'packages/*/package.json' 'packages/*/CHANGELOG.md'
          fi
          echo 'Dry run: nothing was published or pushed.'
      # The release commit, fixed now. A rebase onto a newer main moves HEAD, and a rebase that stops on a conflict leaves
      # HEAD on main's commit, so the recovery step below must not use HEAD.
      - name: Remember the release commit
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # Publishes the packages whose version is not on npm yet, and tags them.
      - name: Publish
        id: publish
        if: '!inputs.dry_run'
        run: pnpm release
      # Only after the publish worked. If main moved while this ran, put the release commit on top of it.
      - name: Push the release commit and the tags to main
        if: '!inputs.dry_run'
        run: |
          git pull --rebase origin main
          git push origin HEAD:main --follow-tags
          git push origin --tags
      # The runner is thrown away when the run ends, so a push that failed after a publish must not lose the commit and
      # the tags. Park them on a branch and on the tags themselves, where they can be merged by hand.
      - name: Keep the release commit if the push to main failed
        if: failure() && steps.publish.outcome == 'success'
        run: |
          git push origin "$RELEASE_SHA:refs/heads/release-unpushed-${{ github.run_id }}" || true
          git push origin --tags || true
          echo "::error::The packages are on npm, but the push to main failed. The release commit is on the branch release-unpushed-${{ github.run_id }}. Merge it into main by hand. Do not run the release again."
      # One GitHub Release for the version, because the four packages share it. The notes are the changelog of the
      # version in `core`. It is the last step, so a failure here is not mistaken for a failed push. It changes nothing on npm or on main: create
      # the release by hand if it happens.
      - name: Create the GitHub Release
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "The release $tag exists already."; exit 0; fi
          {
            awk -v v="$version" '/^## /{ if (f) exit; if ($2 == v) f = 1; next } f' packages/core/CHANGELOG.md
            echo
            echo 'Packages on npm:'
            for p in core elements react vue; do
              echo "- [@01x/dicom-viewer-$p@${version}](https://www.npmjs.com/package/@01x/dicom-viewer-$p/v/${version})"
            done
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --target "$(git rev-parse HEAD)" --latest
